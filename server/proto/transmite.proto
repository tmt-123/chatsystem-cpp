syntax = "proto3";
package bite_im;
import "base.proto";

option cc_generic_services = true;

// ============================================================================
// 消息转发子服务(MsgTransmitService)的协议定义文件
// 本文件定义了网关与消息转发子服务之间的RPC通信契约:
//   - 网关收到客户端"发送新消息"的HTTP请求后,通过brpc调用GetTransmitTarget
//   - 消息转发子服务组装完整MessageInfo、算出目标用户列表、并发布MQ留底后,
//     将message + target_id_list返回给网关,由网关在本地完成实时WebSocket推送
// ============================================================================

//新消息发送请求 -- 由网关构造,用于和消息转发子服务进行通信
//携带发送者身份(由网关鉴权后注入的user_id)、所属会话、消息内容
message NewMessageReq {
    string request_id = 1;  //请求ID -- 全链路唯一标识,便于日志追踪
    optional string user_id = 2;           //发送者用户ID(由网关从session_id反查后注入,不信任客户端)
    optional string session_id = 3;//客户端身份识别信息 -- 这就是消息发送者
    string chat_session_id = 4;  //聊天会话ID -- 标识了当前消息属于哪个会话，应该转发给谁
    MessageContent message = 5; // 消息内容--消息类型+内容
    string client_message_id = 6; //客户端生成的幂等ID，网络重试时必须复用
}

//新消息发送响应 -- 消息转发子服务回给网关,再由网关转为HTTP响应回客户端
//仅表示"转发处理是否成功",不代表接收方已实时收到(实时推送由网关本地完成)
message NewMessageRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    string client_message_id = 4;
    string message_id = 5;
    DeliveryStatus delivery_status = 6;
    uint32 delivered_target_count = 7;
}

//消息转发目标响应 -- 用于网关与消息转发子服务内部的通信
//包含组织好的完整消息结构 + 所有需要接收本条消息的目标用户列表
//网关拿到后遍历target_id_list,在本地_connections中反查每个目标的WebSocket连接并推送
message GetTransmitTargetRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3; 
    MessageInfo message = 4; // 组织好的消息结构 -- 含消息ID/时间戳/发送者/内容
    repeated string target_id_list = 5; //消息的转发目标列表 -- 网关据此逐一推送
}

//消息转发Rpc服务接口
//唯一方法GetTransmitTarget:网关同步调用,获取本条消息的目标用户列表与组织好的消息体
service MsgTransmitService {
    rpc GetTransmitTarget(NewMessageReq) returns (GetTransmitTargetRsp);
}
